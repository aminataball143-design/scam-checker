async function activate(){const k=document.getElementById("lk").value.trim(),m=document.getElementById("lm");
 if(!/^[A-Za-z0-9-]{6,64}$/.test(k)){m.innerHTML=note(t("eFmt"),"ko");if(window.lucide)lucide.createIcons();return}
